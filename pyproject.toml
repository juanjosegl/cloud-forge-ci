[project]
name = "cloud-forge-ci"
version = "0.1.0"
description = "Proyecto didactico: pipeline de CI seguro con Ruff, pytest, Bandit y Trivy"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
